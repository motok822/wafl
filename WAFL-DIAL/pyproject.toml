[project]
name = "wafl-efficiency"
version = "0.1.0"
description = "WAFL Efficiency Module"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2025.4.26",
    "charset-normalizer>=3.4.2",
    "filelock>=3.18.0",
    "fsspec>=2025.3.2",
    "huggingface-hub>=0.31.2",
    "idna>=3.10",
    "jinja2>=3.1.6",
    "markupsafe>=3.0.2",
    "mpmath>=1.3.0",
    "networkx>=3.4.2",
    "numpy>=2.2.5",
    "packaging>=25.0",
    "pillow>=11.2.1",
    "pydantic>=2.12.4",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    "safetensors>=0.5.3",
    "setuptools>=80.7.1",
    "sympy>=1.13.1",
    "timm>=1.0.15",
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "tqdm>=4.67.1",
    "triton>=3.3.0",
    "typing-extensions>=4.13.2",
    "urllib3>=2.4.0",
    "wandb>=0.22.3",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
